[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malleable-fpga"
version = "0.1.0"
description = "Local model-aware dense and OpenTPU LLM simulation experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["torch>=2.2", "numpy>=1.26", "safetensors>=0.4", "transformers>=5.0", "tokenizers>=0.15"]
ide = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["httpx>=0.27", "pytest>=8", "numpy>=1.26", "safetensors>=0.4"]

[project.scripts]
malleable = "malleable.__main__:main"
malleable-llm = "malleable.llm.cli:main"
malleable-ide = "malleable.ide:main"

[tool.setuptools.packages.find]
include = ["malleable*"]

[tool.setuptools.package-data]
malleable = ["web/dist/index.html", "web/dist/assets/*"]
