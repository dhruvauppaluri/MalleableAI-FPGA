[project]
name = "malleable-fpga"
version = "0.1.0"
description = "Reproducible model-aware dense FPGA experiments"
requires-python = ">=3.10"
dependencies = []


[project.scripts]
malleable = "malleable.__main__:main"

[tool.setuptools]
packages = ["malleable"]
