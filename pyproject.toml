[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malleable-fpga"
version = "0.1.0"
description = "Reproducible model-aware dense FPGA experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ssm = ["torch>=2.2", "numpy>=1.26", "safetensors>=0.4", "tokenizers>=0.15"]
ide = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["httpx>=0.27"]

[project.scripts]
malleable = "malleable.__main__:main"
malleable-ssm = "malleable.ssm.cli:main"
malleable-ide = "malleable.ide:main"

[tool.setuptools.packages.find]
include = ["malleable*"]

[tool.setuptools.package-data]
malleable = ["web/*"]
