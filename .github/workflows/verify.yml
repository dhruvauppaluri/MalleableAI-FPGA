name: Verify RTL

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Verify RTL
        run: make test
