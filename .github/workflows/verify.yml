name: Verify RTL and model-aware host

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install RTL toolchain
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys autoconf flex libfl-dev bison g++ help2man

      - name: Build pinned Verilator
        run: |
          git clone --depth 1 --branch v5.050 https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator"
          cd "$RUNNER_TEMP/verilator"
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local LLM and IDE dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -e '.[llm,ide,test]'
          npm --prefix frontend ci

      - name: Verify RTL and host integration
        run: make verify-llm PYTHON=.venv/bin/python
